name: Content Reader ASR contract check
on:
  push:
    branches: [codex/content-reader-asr-verification-20261025]
    paths: [.github/workflows/content-reader-asr-contract-check.yml]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check changed modules
        run: |
          node --check src/services/local-whisper.js
          node --check src/services/transcription.js
          node --check src/services/acquisition-result.js
          node --check test/local-whisper.test.js
          node --check test/acquisition-worker.test.js
      - name: Targeted offline contract tests
        run: node --test test/acquisition-worker.test.js test/local-whisper.test.js test/douyin-pipeline.test.js
