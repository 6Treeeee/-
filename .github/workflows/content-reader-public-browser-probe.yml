name: content-reader-public-browser-probe
run-name: ${{ github.ref == 'refs/heads/codex/content-reader-acquisition' && github.event.head_commit.message || (inputs.mode == 'acquisition' && format('acquisition:{0}', inputs.request_id) || format('worker-smoke:{0}', github.sha)) }}

on:
  push:
    branches: [codex/a2a-control-loop, codex/content-reader-acquisition]
    paths:
      - acquisition-request.json
      - src/services/public-browser.js
      - src/providers/direct-public-web.js
      - src/platforms/douyin.js
      - src/services/hard-subtitle-ocr.js
      - src/services/public-player-wait.js
      - src/services/public-profile-probe.js
      - src/services/hard-subtitle-worker.py
      - src/services/acquisition-*.js
      - api/acquisition.js
      - scripts/acquisition-worker.mjs
      - scripts/probe-public-profile-list.mjs
      - scripts/probe-sparticuz-video.mjs
      - scripts/probe-content-reader-full.mjs
      - test/douyin-pipeline.test.js
      - test/public-browser-runtime.test.js
      - test/acquisition-worker.test.js
      - test/hard-subtitle-ocr-player.test.js
      - test/public-profile-probe.test.js
      - .github/workflows/content-reader-public-browser-probe.yml
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, acquisition, profile_probe]
        default: probe
      aweme_id:
        type: string
        default: '7688672103729483058'
      request_id:
        type: string
        default: ''
      profile_url:
        type: string
        default: 'https://www.douyin.com/user/MS4wLjABAAAAMEVn6NAGiP-Cl-nSADZK95shqCYjDgAV2br2KwEmvBG4gcMAVo3BUvYw4w5iZ_xP'

permissions:
  contents: read

jobs:
  probe:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'profile-probe:')) && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'profile_probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: node --test test/public-browser-runtime.test.js test/douyin-pipeline.test.js test/acquisition-worker.test.js test/hard-subtitle-ocr-player.test.js
      - name: Existing fixed baseline probe (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: node scripts/probe-sparticuz-video.mjs '7688672103729483058'
      - name: Package existing OCR runtime
        run: node scripts/package-ocr-runtime.mjs
      - name: Existing baseline full OCR (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        env:
          PROBE_SERVERLESS: '1'
          PROBE_REQUEST_BUDGET_MS: '285000'
          CONTENT_READER_OCR_PYTHON: assets/ocr/python/bin/python3.12
          CONTENT_READER_HARD_SUBTITLES: '1'
        run: node scripts/probe-content-reader-full.mjs 'https://www.douyin.com/video/7688672103729483058'
      - name: Validate acquisition inputs
        id: task
        if: github.event_name == 'push' || inputs.mode == 'acquisition'
        env:
          INPUT_AWEME_ID: ${{ inputs.aweme_id }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const onDemand = process.env.GITHUB_REF_NAME === 'codex/content-reader-acquisition';
          const smoke = process.env.GITHUB_EVENT_NAME === 'push' && !onDemand;
          const data = onDemand ? JSON.parse(readFileSync('acquisition-request.json', 'utf8')) : null;
          const id = onDemand ? data.aweme_id : smoke ? '7688672103729483058' : process.env.INPUT_AWEME_ID;
          const request = onDemand ? data.request_id : smoke ? randomUUID() : process.env.INPUT_REQUEST_ID;
          if (!/^\d{15,22}$/.test(id ?? '') || !/^[a-f0-9-]{36}$/.test(request ?? '')) throw new Error('Invalid acquisition inputs');
          appendFileSync(process.env.GITHUB_OUTPUT, `aweme_id=${id}\nrequest_id=${request}\n`);
          NODE
      - name: Fresh acquisition and existing OCR
        if: github.event_name == 'push' || inputs.mode == 'acquisition'
        env:
          ACQUISITION_AWEME_ID: ${{ steps.task.outputs.aweme_id }}
          ACQUISITION_REQUEST_ID: ${{ steps.task.outputs.request_id }}
          CONTENT_READER_OCR_PYTHON: assets/ocr/python/bin/python3.12
          CONTENT_READER_HARD_SUBTITLES: '1'
        run: node scripts/acquisition-worker.mjs
      - name: Upload full result and evidence
        if: always() && steps.task.outputs.request_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-${{ steps.task.outputs.request_id }}
          path: acquisition-output/result.json
          if-no-files-found: error
          retention-days: 1

  profile_probe:
    if: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'profile-probe:')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'profile_probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Profile boundary and identity tests
        run: node --test test/public-profile-probe.test.js test/douyin-pipeline.test.js
      - name: Fresh logged-out profile listing probe
        env:
          PROFILE_PROBE_URL: ${{ inputs.profile_url || 'https://www.douyin.com/user/MS4wLjABAAAAMEVn6NAGiP-Cl-nSADZK95shqCYjDgAV2br2KwEmvBG4gcMAVo3BUvYw4w5iZ_xP' }}
        run: node scripts/probe-public-profile-list.mjs "$PROFILE_PROBE_URL"
      - name: Upload limited public listing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-profile-probe-${{ github.run_id }}
          path: profile-probe-output/result.json
          if-no-files-found: ignore
          retention-days: 1
