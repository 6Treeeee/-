name: content-reader-public-browser-probe
# refreshed after runtime test alignment

on:
  push:
    branches:
      - codex/a2a-control-loop
    paths:
      - "src/services/public-browser.js"
      - "src/providers/direct-public-web.js"
      - "scripts/probe-public-web.mjs"
      - "scripts/probe-content-reader-full.mjs"
      - "scripts/package-chrome-libs.mjs"
      - "test/douyin-pipeline.test.js"
      - "test/public-browser-runtime.test.js"
      - ".github/workflows/content-reader-public-browser-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chrome for packaging check
        run: npx @puppeteer/browsers install chrome@stable --path assets/chrome
      - name: Package full Chrome runtime libraries
        run: node scripts/package-chrome-libs.mjs
      - name: Unit tests
        run: node --test test/public-browser-runtime.test.js test/douyin-pipeline.test.js
      - name: Locate Chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Public Douyin browser probe
        run: node scripts/probe-public-web.mjs "https://www.douyin.com/video/7688672103729483058"
      - name: Official public share-page probe
        run: node scripts/probe-public-web.mjs "https://www.iesdouyin.com/share/video/7688672103729483058"

      - name: Package existing OCR runtime
        run: node scripts/package-ocr-runtime.mjs
      - name: Full fresh OCR acceptance
        env:
          CONTENT_READER_OCR_PYTHON: assets/ocr/python/bin/python3.12
          CONTENT_READER_HARD_SUBTITLES: "1"
          CONTENT_READER_LOCAL_REQUEST_BUDGET_MS: "1500000"
        run: node scripts/probe-content-reader-full.mjs "https://www.douyin.com/video/7688672103729483058"
