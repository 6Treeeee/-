name: Preview result contract repair
on:
  push:
    branches: [codex/content-reader-preview-asr-return-fix-20261025]
    paths: [.github/workflows/preview-asr-result-contract.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Use locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check src/services/acquisition-result.js
          node --check test/acquisition-worker.test.js
      - name: Offline result contract and regression
        run: node --test test/acquisition-worker.test.js test/douyin-pipeline.test.js test/local-whisper.test.js
