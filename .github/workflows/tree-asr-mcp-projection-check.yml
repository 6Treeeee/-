name: Tree Content Reader ASR MCP projection contract
on:
  push:
    branches: [codex/content-reader-asr-projection-fix-20261025]
    paths: [.github/workflows/tree-asr-mcp-projection-check.yml]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify syntax
        run: |
          node --check src/mcp/douyin-tools.js
          node --check test/douyin-tools.test.js
      - name: Verify MCP client projection and worker safeguards offline
        run: node --test test/douyin-tools.test.js test/acquisition-worker.test.js test/mcp-server.test.js test/mcp-auth.test.js test/local-whisper.test.js
