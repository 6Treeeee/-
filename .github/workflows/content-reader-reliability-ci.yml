name: content-reader-reliability-ci
on:
  push:
    branches:
      - codex/content-reader-reliability-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Full repository unit and regression suite without external capture
        run: npm test
