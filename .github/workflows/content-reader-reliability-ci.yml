name: content-reader-reliability-ci
on:
  push:
    branches:
      - codex/content-reader-reliability-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit and regression tests without external video capture
        run: |
          node --test test/content-reader-reliability.test.js test/douyin-pipeline.test.js test/content-reader-longmedia-prefetch.test.js test/hard-subtitle-ocr-player.test.js test/ocr-duration.test.js test/acquisition-result-diagnostics.test.js
